<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0B0B0F"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.05">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#F5F7FA" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#F5F7FA" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#F5F7FA" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="800" stroke="#F5F7FA" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#F5F7FA" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="800" stroke="#F5F7FA" stroke-width="1"/>
  </g>

  <!-- Big Looping Frame Motif -->
  <g transform="translate(420, 220)">
    <!-- Outer violet frame -->
    <rect x="20" y="30" width="300" height="300" rx="48" fill="#0B0B0F" stroke="#7F00FF" stroke-width="20"/>
    <!-- Inner lime frame overlapping -->
    <rect x="80" y="80" width="260" height="260" rx="44" fill="#0B0B0F" stroke="#C6FF00" stroke-width="20"/>
    <!-- Core directional triangle -->
    <path d="M185 160 L245 205 L185 250 Z" fill="#F5F7FA"/>
  </g>

  <!-- Brand Typography -->
  <text x="600" y="620" text-anchor="middle" font-family="'Sora', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.02em" fill="#F5F7FA">
    FLUX<tspan fill="#C6FF00">FRAME</tspan>
  </text>
  <text x="600" y="670" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="500" letter-spacing="0.16em" fill="rgba(245, 247, 250, 0.70)">
    FULL AI BRAND IDENTITY SYSTEM
  </text>
</svg>

